<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ViaVeritasVita">
  <!-- Três V: dois formam o W (o pico do meio é o compasso) e o
       terceiro desce pelo centro, entrelaçado. Traço cheio em metal
       dourado → prata → violeta; topos cortados retos na mesma linha;
       as formas se fundem, como no esboço. -->
  <defs>
    <linearGradient id="vvv-metal" gradientUnits="userSpaceOnUse" x1="10" y1="36" x2="190" y2="186">
      <stop offset="0" stop-color="#c39b5e"/>
      <stop offset="0.3" stop-color="#f1d58e"/>
      <stop offset="0.52" stop-color="#eceef2"/>
      <stop offset="0.74" stop-color="#a7b4f0"/>
      <stop offset="1" stop-color="#6d5fe0"/>
    </linearGradient>
    <clipPath id="vvv-topo"><rect x="0" y="36" width="200" height="164"/></clipPath>
    <filter id="vvv-brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g fill="none" stroke-linejoin="miter" stroke-miterlimit="6" stroke-linecap="butt" clip-path="url(#vvv-topo)">
    <!-- brilho difuso -->
    <g stroke="url(#vvv-metal)" stroke-width="16" opacity="0.4" filter="url(#vvv-brilho)">
      <path d="M9 22 L58 150 L100 56 L142 150 L191 22"/>
      <path d="M60 22 L100 146 L140 22"/>
    </g>
    <!-- W (dois V; o pico central é o compasso) -->
    <path d="M9 22 L58 150 L100 56 L142 150 L191 22" stroke="url(#vvv-metal)" stroke-width="16"/>
    <!-- V central -->
    <path d="M60 22 L100 146 L140 22" stroke="url(#vvv-metal)" stroke-width="16"/>
  </g>
</svg>
