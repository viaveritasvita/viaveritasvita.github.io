<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="40" fill="#0b1426"/><g transform="translate(4 -4) scale(0.96)">
  <!-- Os dois V de fora formam o W; o pico do meio sobe até a argola
       e vira o compasso. O terceiro V, em azul-violeta, passa por trás,
       mais alto e mais fundo. W e argola em dourado → prata. -->
  <defs>
    <linearGradient id="vvv-ouro" gradientUnits="userSpaceOnUse" x1="20" y1="40" x2="180" y2="160">
      <stop offset="0" stop-color="#c39b5e"/>
      <stop offset="0.45" stop-color="#f1d58e"/>
      <stop offset="1" stop-color="#e9ebef"/>
    </linearGradient>
    <linearGradient id="vvv-azul" gradientUnits="userSpaceOnUse" x1="58" y1="75" x2="142" y2="158">
      <stop offset="0" stop-color="#8f9cf6"/>
      <stop offset="1" stop-color="#5b4fd6"/>
    </linearGradient>
    <filter id="vvv-brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g fill="none" stroke-width="11" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt">
    <!-- brilho difuso -->
    <g opacity="0.45" filter="url(#vvv-brilho)">
      <path d="M58.8 75 L100 157.7 L141.2 75" stroke="url(#vvv-azul)"/>
      <path d="M21.8 94.6 L61 153.3 L100 49.4 M100 49.4 L139 153.3 L178.2 94.6" stroke="url(#vvv-ouro)"/>
    </g>
    <!-- V central, por trás -->
    <path d="M58.8 75 L100 157.7 L141.2 75" stroke="url(#vvv-azul)"/>
    <!-- W: duas pernas que sobem até a argola (o compasso) -->
    <path d="M21.8 94.6 L61 153.3 L100 49.4" stroke="url(#vvv-ouro)"/>
    <path d="M100 49.4 L139 153.3 L178.2 94.6" stroke="url(#vvv-ouro)"/>
    <!-- argola do compasso -->
    <circle cx="100" cy="41.5" r="6.2" stroke="url(#vvv-ouro)" stroke-width="3.6"/>
  </g>
</g></svg>
